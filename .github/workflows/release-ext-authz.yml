name: Release @jamjet/ext-authz

on:
  push:
    tags:
      - 'ext-authz-v*'

jobs:
  publish:
    name: Publish @jamjet/ext-authz
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/ext-authz
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup with no `version:` reads "packageManager" from the
      # root package.json. Avoids ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      # Literal, unnormalized compare: tag ext-authz-vX must equal package.json
      # version X character for character.
      - name: Gate tag against package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#ext-authz-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version '$TAG_VERSION' != package.json version '$PKG_VERSION'"
            exit 1
          fi

      # npm publish ships the workspace: protocol verbatim and no consumer can
      # resolve it. Pin workspace siblings to a published version first. Node
      # sets the exit code itself, so an error reading package.json also fails.
      - name: Gate against workspace protocol in dependencies
        run: |
          node -e '
            const p = require("./package.json")
            const bad = []
            for (const field of ["dependencies", "optionalDependencies", "peerDependencies"]) {
              for (const [name, range] of Object.entries(p[field] ?? {})) {
                if (String(range).includes("workspace:")) bad.push(`${field}.${name}: ${range}`)
              }
            }
            if (bad.length > 0) {
              console.log("workspace: ranges would ship unresolvable; pin to a published version first:")
              for (const b of bad) console.log("  " + b)
              process.exit(1)
            }
          '

      - name: Install
        run: cd ../.. && pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Build BEFORE Test — integration tests spawn `dist/bin.js`.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Publish to npm with provenance
        # --provenance works because jamjet-policy is public.
        run: npx npm@latest publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

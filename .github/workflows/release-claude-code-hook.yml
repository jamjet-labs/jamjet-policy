name: Release @jamjet/claude-code-hook

on:
  push:
    tags:
      - 'claude-code-hook-v*'

jobs:
  publish:
    name: Publish @jamjet/claude-code-hook
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: packages/claude-code-hook
    steps:
      # Full history, so the main gate below can check the tagged commit
      # against origin/main.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm/action-setup with no `version:` reads "packageManager" from
      # the root package.json (pnpm@9.0.0). Avoids ERR_PNPM_BAD_PM_VERSION.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: 'https://registry.npmjs.org'

      # Literal, unnormalized compare: tag claude-code-hook-vX must equal package.json
      # version X character for character.
      - name: Gate tag against package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#claude-code-hook-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version '$TAG_VERSION' != package.json version '$PKG_VERSION'"
            exit 1
          fi

      # A version tag can point at any commit, including one on a branch that
      # was never reviewed or merged. Publish only commits that are on main.
      - name: Gate tag commit on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_SHA is not on main; tag a commit that has been merged to main"
            exit 1
          fi

      # npm publish ships workspace:, file:, link:, catalog: and git or URL
      # specifiers verbatim, and consumers can't resolve them. Accept only
      # plain semver ranges and dist-tags; pin workspace siblings to a
      # published version first. Node sets the exit code itself, so an error
      # reading package.json also fails.
      - name: Gate dependencies on published versions
        run: |
          node -e '
            const p = require("./package.json")
            const published = /^[0-9A-Za-z.+*^~<>=| -]+$/
            const bad = []
            for (const field of ["dependencies", "optionalDependencies", "peerDependencies"]) {
              for (const [name, range] of Object.entries(p[field] ?? {})) {
                if (typeof range !== "string" || !published.test(range)) bad.push(`${field}.${name}: ${JSON.stringify(range)}`)
              }
            }
            if (bad.length > 0) {
              console.log("these ranges would not resolve for consumers; pin to a published version first:")
              for (const b of bad) console.log("  " + b)
              process.exit(1)
            }
          '

      - name: Install
        run: cd ../.. && pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Publish to npm with provenance
        # Use npx to fetch a fresh npm without overwriting the system bundle.
        # --provenance requires a public GitHub repo (sigstore signs the
        # source URL); jamjet-policy is public, so this works.
        run: npx npm@latest publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

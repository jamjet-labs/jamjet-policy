static_resources:
  listeners:
    - name: ingress
      address: { socket_address: { address: 0.0.0.0, port_value: 8080 } }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress
                route_config:
                  name: r
                  virtual_hosts:
                    - name: vh
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: upstream }
                http_filters:
                  - name: envoy.filters.http.ext_authz
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                      transport_api_version: V3
                      with_request_body: { max_request_bytes: 8192, allow_partial_message: true }
                      http_service:
                        server_uri:
                          uri: pdp:9191
                          cluster: pdp
                          timeout: 1s
                        authorization_request:
                          allowed_headers: { patterns: [{ exact: "x-jamjet-server" }] }
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
    - name: pdp
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: pdp
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: pdp, port_value: 9191 } } } }] }]
    - name: upstream
      connect_timeout: 1s
      type: STRICT_DNS
      load_assignment:
        cluster_name: upstream
        endpoints: [{ lb_endpoints: [{ endpoint: { address: { socket_address: { address: upstream, port_value: 8000 } } } }] }]
